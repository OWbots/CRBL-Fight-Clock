<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRBL Fight Clock</title>
    <style>
:root {
  --bg: #000;
  --cyan: #15d7e9;
  --purple: #8d62ff;
  --red: #ff2014;
  --green: #27ff6a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--cyan);
  font-family: 'Trebuchet MS', 'Arial Black', sans-serif;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  border-bottom: 12px solid var(--cyan);
  padding: 1rem 2rem;
}

.brand-block { min-width: 210px; }
.logo {
  font-size: clamp(2rem, 5vw, 3.4rem);
  font-weight: 900;
  font-style: italic;
  line-height: 1;
}
.subtitle {
  margin-top: 0.4rem;
  font-size: clamp(0.55rem, 1.1vw, 0.9rem);
  letter-spacing: 0.08em;
}

.title-block {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.35rem;
}

h1 {
  margin: 0;
  line-height: 0.95;
  font-size: clamp(2.2rem, 6vw, 5rem);
  letter-spacing: 0.06em;
}

#statusLine {
  margin: 0;
  color: var(--purple);
  font-size: clamp(1rem, 1.8vw, 1.7rem);
  line-height: 1.15;
  max-width: 100%;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem;
  color: var(--purple);
}

.controls input,
.controls button {
  background: #111;
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-size: 1rem;
  padding: 0.3rem 0.5rem;
}

#timerContainer {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: min(1.2vw, 16px);
  padding: 2vh 2vw;
}

.digit {
  width: var(--digit-width);
  height: var(--digit-height);
  position: relative;
}

.segment {
  position: absolute;
  background: transparent;
}

.on { background: var(--digit-color); }

.h {
  width: 70%;
  height: 12%;
  left: 15%;
  clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
}

.v {
  width: 18%;
  height: 36%;
  clip-path: polygon(0 8%, 50% 0, 100% 8%, 100% 92%, 50% 100%, 0 92%);
}

.a { top: 0; }
.d { bottom: 0; }
.g { top: 44%; }
.b { top: 7%; right: 0; }
.c { bottom: 8%; right: 0; }
.e { bottom: 8%; left: 0; }
.f { top: 7%; left: 0; }

.colon {
  width: calc(var(--digit-width) * 0.22);
  height: var(--digit-height);
  position: relative;
}

.colon::before,
.colon::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--digit-color);
}

.colon::before { top: 33%; }
.colon::after { top: 58%; }

.overlay {
  position: fixed;
  inset: 0;
  background: #000;
  color: var(--cyan);
  display: grid;
  place-items: center;
  text-align: center;
  z-index: 100;
}

#overlayText {
  font-size: clamp(3rem, 20vw, 15rem);
  font-weight: 900;
}

.pause-info {
  position: fixed;
  right: 1.5rem;
  top: clamp(6.2rem, 13vh, 8.6rem);
  z-index: 120;
  text-align: right;
  line-height: 1.1;
}

.pause-info p {
  margin: 0.4rem 0;
  font-size: clamp(1.1rem, 2.3vw, 2.3rem);
}

.pause-info .paused { color: #fff; }
.pause-info p:nth-child(2) { color: var(--green); }
.pause-info p:nth-child(3) { color: var(--red); }

.hidden { display: none; }

@media (max-width: 768px) {
  .top-bar {
    padding: 0.8rem;
    flex-direction: column;
    align-items: flex-start;
  }

  .title-block {
    width: 100%;
    align-items: flex-start;
    text-align: left;
  }

  .controls { flex-wrap: wrap; }

  .pause-info {
    left: 0;
    right: 0;
    top: clamp(8.5rem, 20vh, 10.5rem);
    text-align: center;
  }
}
    </style>
    <link rel="stylesheet" href="./styles.css?v=20260219" />
  </head>
  <body>
    <main id="app">
      <header class="top-bar">
        <div class="brand-block">
          <div class="logo">CRBL</div>
          <div class="subtitle">COMBAT ROBOTICS BRICK LEAGUE</div>
        </div>
        <div class="title-block">
          <h1>CRBL CLOCK</h1>
          <p id="statusLine">Press Space to Start</p>
        </div>
      </header>

      <section class="controls" aria-label="Clock settings">
        <label for="durationMinutes">Minutes</label>
        <input id="durationMinutes" type="number" min="0" max="59" value="2" />
        <label for="durationSeconds">Seconds</label>
        <input id="durationSeconds" type="number" min="0" max="59" value="0" />
        <button id="applyDuration" type="button">Set Duration</button>
      </section>

      <section id="timerContainer" aria-label="Fight clock"></section>

      <section id="overlay" class="overlay hidden" aria-live="assertive">
        <div id="overlayText"></div>
      </section>

      <section id="pauseInfo" class="pause-info hidden" aria-live="polite">
        <p class="paused">Match Paused</p>
        <p>Space -&gt; Resume</p>
        <p>r -&gt; reset</p>
      </section>
    </main>

    <script src="./app.js?v=20260219"></script>
  </body>
</html>
